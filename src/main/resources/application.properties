spring.application.name=KavachAR

# Render provides PORT; 8080 is used locally
server.port=${PORT:8080}
server.address=0.0.0.0

# =========================
# Aiven MySQL
# =========================
spring.datasource.url=${AIVEN_URL}

spring.datasource.username=avnadmin
spring.datasource.password=${AIVEN_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}

# JWT expiration = 1 hour
jwt.expiration=3600000

# =========================
# Django Service Authentication
# =========================
django.service-token=${DJANGO_SERVICE_TOKEN}

# =========================
# Certificate Verification
# =========================
app.certificate.verification-url=${CERTIFICATE_VERIFICATION_URL}
