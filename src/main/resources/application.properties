spring.application.name=KavachAR

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/kavachAR
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

server.address=0.0.0.0
#JWT secret is taken from environment variable
jwt.secret=${JWT_SECRET}

# JWT expiration = 1 hour
jwt.expiration=3600000

# Verify through Certificate URL
app.certificate.verification-url=https://2ba2-103-192-119-252.ngrok-free.app/api/auth/cert-verification