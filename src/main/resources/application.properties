spring.application.name=KavachAR

# Render provides PORT; 8080 is used locally
server.port=${PORT:8080}
server.address=0.0.0.0

# =========================
# Aiven MySQL
# =========================
spring.datasource.url=jdbc:mysql://kavachar-db-sudipp910-9240.h.aivencloud.com:19839/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${AIVEN_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}

# JWT expiration = 1 hour
jwt.expiration=3600000

# =========================
# Certificate Verification
# =========================
#app.certificate.verification-url=https://2ba2-103-192-119-252.ngrok-free.app/api/auth/cert-verification

app.certificate.verification-url=${CERTIFICATE_VERIFICATION_URL}